<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диагноза на проблема | Ниво 2 — Видео 2</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7A4F94;
    --purple-mid: #9B6BB5;
    --purple-light: #C4A0D8;
    --pink: #C4789A;
    --pink-light: #E8A0B4;
    --bg: #FDF5F7;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --muted: #666666;
    --border: #DDD0E8;
    --light-purple: #F5EEF8;
    --light-pink: #FDF0F5;
    --green: #3D8B6E;
    --green-light: #E4F3ED;
    --blue: #3A6EA8;
    --blue-light: #EAF0FA;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .top-bar {
    height: 5px;
    background: linear-gradient(90deg, var(--purple), var(--pink-light), var(--purple-light));
  }

  .container {
    max-width: 660px;
    margin: 0 auto;
    padding: 36px 22px 80px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease both;
  }

  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--purple), var(--purple-mid));
    color: white;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 5vw, 34px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
    margin-bottom: 10px;
  }

  .header h1 span { color: var(--purple); }

  .header p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 460px;
    margin: 0 auto;
  }

  /* PROGRESS */
  .progress-wrap {
    margin-bottom: 28px;
    animation: fadeDown 0.5s 0.1s ease both;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
  }

  .progress-label { font-size: 12px; color: var(--muted); }
  .progress-count { font-size: 12px; font-weight: 600; color: var(--purple); }

  .progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--pink-light));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--card);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 2px 16px rgba(122,79,148,0.08);
    border: 1px solid var(--border);
    animation: fadeUp 0.45s ease both;
  }

  .question-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--purple-light);
    margin-bottom: 12px;
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 3vw, 19px);
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 24px;
  }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 15px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
  }

  .option:hover:not(:disabled) {
    border-color: var(--purple-light);
    background: var(--light-purple);
    transform: translateX(3px);
  }

  .option.selected {
    border-color: var(--purple);
    background: var(--light-purple);
  }

  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    margin-top: 1px;
  }

  .option.selected .option-letter {
    background: var(--purple);
    color: white;
  }

  .option-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .option:disabled { cursor: default; }

  /* NEXT BUTTON */
  .btn-next {
    display: none;
    margin-top: 22px;
    width: 100%;
    padding: 15px 22px;
    background: linear-gradient(135deg, var(--purple), #5A3580);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-next:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(122,79,148,0.3);
  }

  /* RESULTS */
  .results { display: none; animation: fadeUp 0.6s ease both; }

  .result-card {
    background: var(--card);
    border-radius: 22px;
    padding: 40px 32px;
    box-shadow: 0 4px 28px rgba(122,79,148,0.1);
    border: 1px solid var(--border);
    text-align: center;
    margin-bottom: 20px;
  }

  .result-icon { font-size: 48px; margin-bottom: 16px; display: block; }

  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(20px, 4vw, 26px);
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .result-subtitle {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .result-problem {
    border-radius: 14px;
    padding: 20px 22px;
    text-align: left;
    margin-bottom: 20px;
  }

  .result-problem .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  .result-problem p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }

  .result-reassure {
    background: var(--light-purple);
    border: 1px solid var(--border);
    border-left: 4px solid var(--purple);
    border-radius: 12px;
    padding: 18px 20px;
    text-align: left;
    margin-bottom: 24px;
  }

  .result-reassure p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }

  .result-reassure strong { color: var(--purple); }

  .btn-retry {
    width: 100%;
    padding: 14px 22px;
    background: transparent;
    color: var(--purple);
    border: 2px solid var(--purple);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-retry:hover {
    background: var(--purple);
    color: white;
    transform: translateY(-2px);
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .question-card { padding: 24px 18px; }
    .result-card { padding: 32px 22px; }
  }
</style>
</head>
<body>

<div class="top-bar"></div>

<div class="container">

  <div class="header">
    <div class="badge">Ниво 2 · Видео 2</div>
    <h1>Диагноза: <span>Кой е твоят проблем?</span></h1>
    <p>5 въпроса, за да разберете заедно откъде да тръгнем в изграждането на твоята система.</p>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-meta">
      <span class="progress-label">Напредък</span>
      <span class="progress-count" id="progressCount">Въпрос 1 от 5</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="results" id="results"></div>

</div>

<script>
const questions = [
  {
    q: "Как би описала броя на клиентките си в момента?",
    options: [
      "Малко — часовете ми са предимно свободни",
      "Имам клиентки, но идват нередовно — понякога препълнена, понякога празна",
      "Имам достатъчно редовни клиентки, но не изкарвам колкото искам",
      "Препълнена съм, но пак не изкарвам достатъчно"
    ],
    scores: [
      { привличане: 3, задържане: 0, приход: 0 },
      { привличане: 1, задържане: 3, приход: 0 },
      { привличане: 0, задържане: 1, приход: 3 },
      { привличане: 0, задържане: 0, приход: 3 }
    ]
  },
  {
    q: "Когато клиентка дойде за пръв път — колко от тях се връщат втори път?",
    options: [
      "Почти всички се връщат",
      "Около половината",
      "Малка част — повечето изчезват след първия път",
      "Рядко имам първи посещения изобщо"
    ],
    scores: [
      { привличане: 0, задържане: 0, приход: 2 },
      { привличане: 0, задържане: 2, приход: 1 },
      { привличане: 0, задържане: 3, приход: 0 },
      { привличане: 3, задържане: 0, приход: 0 }
    ]
  },
  {
    q: "Откъде идват повечето ти нови клиентки?",
    options: [
      "Предимно от препоръки на съществуващи клиентки",
      "От социалните мрежи — Instagram, Facebook",
      "Почти не идват нови — разчитам на старите",
      "Не знам точно откъде идват"
    ],
    scores: [
      { привличане: 0, задържане: 1, приход: 1 },
      { привличане: 1, задържане: 0, приход: 1 },
      { привличане: 2, задържане: 2, приход: 0 },
      { привличане: 3, задържане: 1, приход: 0 }
    ]
  },
  {
    q: "Как се чувстваш с цените си в момента?",
    options: [
      "Цените ми са добри — клиентките не се оплакват",
      "Чувствам, че работя много, но остава малко",
      "Боя се да вдигна цените, защото клиентките могат да избягат",
      "Не съм сигурна дали цените ми са правилни изобщо"
    ],
    scores: [
      { привличане: 1, задържане: 1, приход: 0 },
      { привличане: 0, задържане: 0, приход: 3 },
      { привличане: 0, задържане: 1, приход: 3 },
      { привличане: 1, задържане: 0, приход: 2 }
    ]
  },
  {
    q: "Ако спреш да публикуваш в социалните мрежи за месец — какво би се случило?",
    options: [
      "Нищо особено — клиентките ми идват от препоръки, не от Instagram",
      "Вероятно ще намалеят запитванията от нови хора",
      "Ще изчезна напълно — почти всичко зависи от публикуването",
      "Не знам — никога не съм опитвала"
    ],
    scores: [
      { привличане: 0, задържане: 2, приход: 1 },
      { привличане: 2, задържане: 0, приход: 1 },
      { привличане: 3, задържане: 0, приход: 0 },
      { привличане: 2, задържане: 1, приход: 0 }
    ]
  }
];

const profiles = {
  привличане: {
    icon: '🔍',
    title: 'Основният ти проблем е привличането',
    subtitle: 'Имаш качество — но хората, които не те познават, все още не те намират.',
    problem: {
      bg: '#EAF0FA',
      label: '💡 Какво означава това',
      labelColor: '#3A6EA8',
      text: 'Бизнесът ти разчита предимно на случайността или на тесен кръг хора, които вече те познават. Нови клиентки идват рядко — не защото работата ти не е добра, а защото системата за привличане все още не е изградена. Хората, които биха те харесали, просто не знаят, че съществуваш.'
    },
    reassure: 'Точно това ще изградим заедно в Ниво 2. Ще научиш за кого работиш, как да се позиционираш на пазара и как да привличаш правилните хора с правилното съдържание. Стъпка по стъпка — системата ще заработи.'
  },
  задържане: {
    icon: '🔄',
    title: 'Основният ти проблем е задържането',
    subtitle: 'Хората те намират и идват — но не се връщат толкова, колкото би искала.',
    problem: {
      bg: '#F5EEF8',
      label: '💡 Какво означава това',
      labelColor: '#7A4F94',
      text: 'Привличането работи — имаш клиентки, идват нови хора. Но след първото или второто посещение голяма част изчезват. Може би нямаш система, която поддържа контакта с тях между посещенията. Може би не им напомняш навреме. Може би не са се почувствали достатъчно специални, за да се върнат точно при теб.'
    },
    reassure: 'Точно това ще изградим заедно в Ниво 2. Ще научиш как да премахваш съмненията, как да създаваш съдържание което задържа, и как да изградиш система, която работи дори когато ти не си там. Клиентките, които вече имаш, са най-ценният ти ресурс.'
  },
  приход: {
    icon: '📈',
    title: 'Основният ти проблем е средният приход',
    subtitle: 'Имаш клиентки и те се връщат — но финансово нещо не се наврзва.',
    problem: {
      bg: '#FDF0F5',
      label: '💡 Какво означава това',
      labelColor: '#C4789A',
      text: 'Привличането и задържането работят — имаш редовни клиентки, часовете ти са запълнени. Но в края на месеца остава по-малко, отколкото би трябвало. Вероятно цените не отразяват реалната стойност на работата ти, или не предлагаш следваща стъпка на клиентките след основната услуга. Работиш много — и може да работиш по-умно.'
    },
    reassure: 'Точно това ще разгледаме заедно в Ниво 2. Ще научиш как да се позиционираш така, че цените ти да имат смисъл, как да предлагаш следваща стъпка без да се чувстваш натрапчива, и как да ценообразуваш правилно. Имаш основата — сега ще я оптимизираме.'
  }
};

let current = 0;
const totalScores = { привличане: 0, задържане: 0, приход: 0 };

function renderQuestion() {
  const q = questions[current];
  const letters = ['А', 'Б', 'В', 'Г'];

  document.getElementById('progressCount').textContent = `Въпрос ${current + 1} от ${questions.length}`;
  document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;

  document.getElementById('quiz').innerHTML = `
    <div class="question-card">
      <div class="question-num">Въпрос ${current + 1}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">
        ${q.options.map((opt, i) => `
          <button class="option" id="opt${i}" onclick="selectAnswer(${i})">
            <span class="option-letter">${letters[i]}</span>
            <span class="option-text">${opt}</span>
          </button>
        `).join('')}
      </div>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">
        ${current < questions.length - 1 ? 'Следващ въпрос →' : 'Виж диагнозата →'}
      </button>
    </div>
  `;
}

function selectAnswer(idx) {
  document.querySelectorAll('.option').forEach(o => {
    o.disabled = true;
    o.classList.remove('selected');
  });
  document.getElementById(`opt${idx}`).classList.add('selected');

  const s = questions[current].scores[idx];
  totalScores.привличане += s.привличане;
  totalScores.задържане += s.задържане;
  totalScores.приход += s.приход;

  document.getElementById('btnNext').style.display = 'block';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showResults() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressCount').textContent = 'Завършен!';
  document.getElementById('quiz').style.display = 'none';

  // Find dominant problem
  const winner = Object.entries(totalScores).sort((a, b) => b[1] - a[1])[0][0];
  const profile = profiles[winner];

  document.getElementById('results').style.display = 'block';
  document.getElementById('results').innerHTML = `
    <div class="result-card">
      <span class="result-icon">${profile.icon}</span>
      <h2 class="result-title">${profile.title}</h2>
      <p class="result-subtitle">${profile.subtitle}</p>

      <div class="result-problem" style="background: ${profile.problem.bg}; border-left: 4px solid ${profile.problem.labelColor};">
        <span class="label" style="color: ${profile.problem.labelColor}">${profile.problem.label}</span>
        <p>${profile.problem.text}</p>
      </div>

      <div class="result-reassure">
        <p>${profile.reassure}</p>
      </div>

      <button class="btn-retry" onclick="restartQuiz()">↺ Направи теста отново</button>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  current = 0;
  totalScores.привличане = 0;
  totalScores.задържане = 0;
  totalScores.приход = 0;
  document.getElementById('results').style.display = 'none';
  document.getElementById('results').innerHTML = '';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('progressFill').style.width = '0%';
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuestion();
</script>
</body>
</html>
