<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калкулатор за Ценообразуване — PrimaDonna</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#E8A0B4;--pink-light:#F5D5E0;--pink-pale:#FDF5F7;
  --purple:#9B6BB5;--purple-dark:#7A4E9A;
  --text:#2D2D2D;--text-light:#7A6070;
  --border:#EDD5DF;--white:#FFFFFF;
  --green:#2D7A4A;--green-light:#E8F5ED;--green-dark:#1A4A2E;
  --yellow:#D4860A;--yellow-light:#FEF5E4;--yellow-dark:#7A5000;
  --red:#C0392B;--red-light:#FDECEA;--red-dark:#7A1A1A;
  --shadow:0 4px 20px rgba(155,107,181,.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--pink-pale);color:var(--text);line-height:1.6;padding:20px 0;}
.container{max-width:900px;margin:0 auto;padding:0 20px;}
header{text-align:center;margin-bottom:40px;}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,6vw,42px);color:var(--purple-dark);font-weight:300;margin-bottom:10px;}
.section{background:var(--white);border-radius:24px;padding:30px;margin-bottom:25px;border:1px solid var(--border);box-shadow:var(--shadow);}
.section-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-bottom:25px;color:var(--purple);border-bottom:1.5px solid var(--pink-light);padding-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:650px){.grid-2{grid-template-columns:1fr;}}
.input-group{margin-bottom:18px;}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin-bottom:8px;font-weight:600;}
.input-wrapper{position:relative;display:flex;align-items:center;}
input,select{width:100%;padding:12px 15px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;background:var(--pink-pale);transition:0.2s;font-family:inherit;}
input:focus{outline:none;border-color:var(--purple);background:white;box-shadow:0 0 0 4px rgba(155,107,181,0.1);}
.unit{position:absolute;right:15px;font-size:12px;color:var(--text-light);font-weight:500;}
.btn-primary{width:100%;padding:20px;background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);color:white;border:none;border-radius:16px;font-family:'Cormorant Garamond',serif;font-size:24px;cursor:pointer;transition:0.3s;box-shadow:0 10px 25px rgba(155,107,181,0.25);margin-top:10px;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 15px 35px rgba(155,107,181,0.35);}
#results-area{display:none;margin-top:40px;}
.svc-card{background:white;border-radius:20px;border:1px solid var(--border);padding:20px;margin-bottom:20px;transition:0.3s;}
.svc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;}
.svc-name{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--purple-dark);font-weight:600;}
.svc-detail{font-size:13px;color:var(--text-light);}
.svc-recommended{font-size:28px;font-weight:500;color:var(--purple);}
.svc-diagnosis{margin-top:15px;padding:12px;border-radius:10px;font-size:14px;font-weight:500;}
.diag-red{background:var(--red-light);color:var(--red);border:1px solid #F5C6CB;}
.diag-green{background:var(--green-light);color:var(--green);border:1px solid #C3E6CB;}
.mkt-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--border);}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;}
.badge-green{background:var(--green-light);color:var(--green-dark);}
.badge-yellow{background:var(--yellow-light);color:var(--yellow-dark);}
.badge-red{background:var(--red-light);color:var(--red-dark);}
.cta-box{background:linear-gradient(135deg,#1A0A2E 0%,#2D1050 100%);color:white;padding:40px;border-radius:24px;text-align:center;margin-top:50px;}
.cta-box h3{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:15px;}
.cta-box p{margin-bottom:25px;opacity:0.9;}
.cta-btn{display:inline-block;padding:15px 40px;background:var(--pink);color:white;text-decoration:none;border-radius:50px;font-weight:700;transition:0.3s;}
.cta-btn:hover{transform:scale(1.05);background:#d88ea3;}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Калкулатор PrimaDonna</h1>
    <p>Професионален инструмент за бизнес анализ и ценообразуване</p>
  </header>

  <div class="section">
    <div class="section-title">1. Месечни фиксирани разходи</div>
    <div class="grid-2">
      <div class="input-group"><label>Наем</label><div class="input-wrapper"><input type="number" id="rent" value="200"><span class="unit">€
