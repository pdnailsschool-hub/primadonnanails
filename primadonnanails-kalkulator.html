<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Професионален Бизнес Калкулатор — PrimaDonna Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#E8A0B4;--pink-light:#F5D5E0;--pink-pale:#FDF5F7;
  --purple:#9B6BB5;--purple-dark:#7A4E9A;
  --text:#2D2D2D;--text-light:#7A6070;
  --border:#EDD5DF;--white:#FFFFFF;
  --green:#2D7A4A;--green-light:#E8F5ED;--green-dark:#1A4A2E;
  --red:#C0392B;--red-light:#FDECEA;--red-dark:#7A1A1A;
  --shadow:0 4px 20px rgba(155,107,181,0.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--pink-pale);color:var(--text);padding:20px;line-height:1.4}
.container{max-width:900px;margin:0 auto;background:var(--white);padding:35px;border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
header{text-align:center;margin-bottom:30px}
h1{font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--purple-dark)}
.step{margin-bottom:25px;padding:20px;background:var(--white);border:1px solid var(--border);border-radius:18px}
.step-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:15px;color:var(--purple-dark);display:flex;align-items:center;gap:10px}
.step-number{background:var(--purple);color:white;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:12px}
label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;margin-bottom:5px;color:var(--text-light)}
input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.calc-btn{width:100%;padding:18px;background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);color:white;border:none;border-radius:12px;font-family:'Cormorant Garamond',serif;font-size:22px;cursor:pointer;margin:20px 0}

/* Стил за услугите (Разбивка) */
.svc-card{background:var(--pink-pale);padding:20px;border-radius:15px;margin-bottom:15px;border:1px solid var(--border)}
.svc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:10px}
.svc-name{font-weight:600;color:var(--purple-dark)}
.svc-ideal-price{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--purple-dark)}
.breakdown-row{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-top:10px}
.percent-box{background:white;padding:8px;border-radius:8px;text-align:center;font-size:11px;border:1px solid var(--border)}
.percent-label{font-size:9px;color:var(--text-light);display:block}

.alert{padding:15px;border-radius:10px;margin-top:10px;font-size:13px}
.alert-red{background:var(--red-light);color:var(--red-dark);border:1px solid var(--red)}
.alert-green{background:var(--green-light);color:var(--green-dark);border:1px solid var(--green)}
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>Обучение: <em>Ценообразуване</em></h1>
        <p>Професионален модел за изчисление на маржа</p>
    </header>

    <div class="step">
        <div class="step-title"><span class="step-number">1</span> Месечни разходи</div>
        <div class="grid">
            <div class="field"><label>Наем</label><input type="number" id="rent" value="200"></div>
            <div class="field"><label>Електричество</label><input type="number" id="elec" value="100"></div>
            <div class="field"><label>Вода</label><input type="number" id="water" value="5"></div>
            <div class="field"><label>Счетоводител</label><input type="number" id="acc" value="50"></div>
            <div class="field"><label>ТВ/Нет</label><input type="number" id="comm" value="25"></div>
            <div class="field"><label>СОТ</label><input type="number" id="security" value="15"></div>
            <div class="field"><label>Осигуровки</label><input type="number" id="insur" value="200"></div>
            <div class="field"><label>Заплата</label><input type="number" id="salary" value="1500"></div>
        </div>
        <div class="field" style="margin-top:15px; width: 50%">
            <label>Работни часове в месеца</label>
            <input type="number" id="work-hours" value="176">
        </div>
    </div>

    <div class="step">
        <div class="step-title"><span class="step-number">2</span> Материали за 1 процедура</div>
        <div class="grid">
            <div class="field"><label>База (€)</label><input type="number" id="m1" value="0.23"></div>
            <div class="field"><label>Топ (€)</label><input type="number" id="m2" value="0.26"></div>
            <div class="field"><label>Гел (€)</label><input type="number" id="m3" value="0.40"></div>
            <div class="field"><label>Цвят (€)</label><input type="number" id="m4" value="0.20"></div>
            <div class="field"><label>Консумативи (€)</label><input type="number" id="m5" value="0.12"></div>
        </div>
    </div>

    <div class="step">
        <div class="step-title"><span class="step-number">3</span> Разбивка по услуги</div>
        <p style="font-size:11px; color:var(--text-light); margin-bottom:15px;">Въведете времетраенето и вашата цена за анализ:</p>
        
        <div id="services-list">
            <div class="svc-input-row" style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px; margin-bottom:10px;">
                <label style="margin:0">Име на услугата</label>
                <label style="margin:0">Време (час)</label>
                <label style="margin:0">Твоя цена (€)</label>
            </div>
            
            <div class="service-entry" style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px; margin-bottom:15px;">
                <input type="text" class="svc-name-in" value="Маникюр с гел лак">
                <input type="number" class="svc-time-in" value="1.5" step="0.1">
                <input type="number" class="svc-price-in" value="30">
            </div>
            <div class="service-entry" style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px; margin-bottom:15px;">
                <input type="text" class="svc-name-in" value="Изграждане с гел">
                <input type="number" class="svc-time-in" value="2.5" step="0.1">
                <input type="number" class="svc-price-in" value="50">
            </div>
        </div>
    </div>

    <button class="calc-btn" onclick="runPriceAnalysis()">АНАЛИЗИРАЙ ЦЕНИТЕ С МАРЖ 0.60</button>

    <div id="results-container"></div>

    <p style="text-align:center; font-size:11px; margin-top:30px; color:var(--text-light)">PrimaDonna Academy — Образователен ресурс за управление на цените</p>
</div>

<script>
function runPriceAnalysis() {
    // 1. Изчисляване на разход за минута
    const fixedCosts = ['rent','elec','water','acc','comm','security','insur','salary']
        .reduce((s, id) => s + (parseFloat(document.getElementById(id).value) || 0), 0);
    const workHours = parseFloat(document.getElementById('work-hours').value) || 1;
    const costPerMin = fixedCosts / (workHours * 60);

    // 2. Преки разходи материали
    const mats = ['m1','m2','m3','m4','m5']
        .reduce((s, id) => s + (parseFloat(document.getElementById(id).value) || 0), 0);

    // 3. Обработка на всяка услуга
    const entries = document.querySelectorAll('.service-entry');
    let resultsHtml = '';

    entries.forEach(entry => {
        const name = entry.querySelector('.svc-name-in').value;
        const timeHours = parseFloat(entry.querySelector('.svc-time-in').value) || 0;
        const userPrice = parseFloat(entry.querySelector('.svc-price-in').value) || 0;

        const timeCost = costPerMin * (timeHours * 60);
        const totalBaseCost = timeCost + mats;

        // Идеална цена по метода на маржа (Разходи / 0.60)
        const idealPrice = totalBaseCost / 0.60;

        // Разбивка на маржа (процентите)
        const tax15 = idealPrice * 0.15;
        const edu15 = idealPrice * 0.15;
        const profit10 = idealPrice * 0.10;

        // Анализ загуба/печалба
        let alertHtml = '';
        if (userPrice < idealPrice) {
            const loss = idealPrice - userPrice;
            alertHtml = `<div class="alert alert-red">Внимание! Вие подарявате на клиента <strong>${loss.toFixed(2)} €</strong>. Вашата цена трябва да бъде минимум ${idealPrice.toFixed(2)} €!</div>`;
        } else {
            alertHtml = `<div class="alert alert-green">Поздравления! Вашият бизнес е устойчив и печеливш.</div>`;
        }

        resultsHtml += `
            <div class="svc-card">
                <div class="svc-header">
                    <span class="svc-name">${name}</span>
                    <span class="svc-ideal-price">${idealPrice.toFixed(2)} €</span>
                </div>
                <div style="font-size:11px; color:var(--text-light)">Себестойност (труд+мат): ${totalBaseCost.toFixed(2)} €</div>
                
                <div class="breakdown-row">
                    <div class="percent-box">
                        <span class="percent-label">Данъци (15%)</span>
                        <strong>
