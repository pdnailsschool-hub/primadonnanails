<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калкулатор PrimaDonna</title>
    <style>
        body { font-family: sans-serif; background: #FDF5F7; color: #2D2D2D; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; border: 1px solid #EDD5DF; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #7A4E9A; text-align: center; font-size: 24px; }
        h3 { border-bottom: 1px solid #F5D5E0; padding-bottom: 5px; color: #9B6BB5; margin-top: 25px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #EDD5DF; border-radius: 8px; box-sizing: border-box; background: #FDF5F7; font-size: 16px; }
        .btn { width: 100%; padding: 15px; background: #7A4E9A; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        #results { display: none; margin-top: 25px; padding: 20px; border-radius: 10px; background: #f9f9f9; border: 1px solid #ddd; }
        .price-box { text-align: center; font-size: 32px; color: #7A4E9A; font-weight: bold; margin: 10px 0; }
        .diagnosis { padding: 15px; border-radius: 8px; margin-top: 15px; font-weight: bold; text-align: center; }
        .red { background: #FDECEA; color: #C0392B; border: 1px solid #D5A8A8; }
        .green { background: #E8F5ED; color: #2D7A4A; border: 1px solid #A8D5B8; }
        .cta { background: #1A0A2E; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-top: 30px; }
        .cta a { color: #E8A0B4; font-weight: bold; text-decoration: none; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Калкулатор PrimaDonna</h1>

    <h3>1. Месечни разходи</h3>
    <div class="field"><label>Наем (€)</label><input type="number" id="rent" value="200"></div>
    <div class="field"><label>Електричество (€)</label><input type="number" id="electric" value="100"></div>
    <div class="field"><label>Счетоводител (€)</label><input type="number" id="accountant" value="50"></div>
    <div class="field"><label>Осигуровки (€)</label><input type="number" id="social" value="200"></div>
    <div class="field"><label>Заплата (€)</label><input type="number" id="salary" value="1500"></div>
    <div class="field"><label>Други (СОТ, Нет, Вода) (€)</label><input type="number" id="others" value="45"></div>
    <div class="field"><label>Работни часове</label><input type="number" id="hours" value="176"></div>

    <h3>2. Услуга</h3>
    <div class="field"><label>Времетраене (минути)</label><input type="number" id="time" value="60"></div>
    <div class="field"><label>Материали (€)</label><input type="number" id="mat" value="1.21" step="0.01"></div>
    <div class="field"><label>Вашата текуща цена (€)</label><input type="number" id="current" placeholder="На колко продавате сега?"></div>

    <button class="btn" onclick="calculate()">АНАЛИЗИРАЙ БИЗНЕСА</button>

    <div id="results">
        <div style="text-align:center; font-size:14px; text-transform:uppercase;">Идеална цена (Метод на Маржа):</div>
        <div class="price-box" id="idealPrice">0.00 €</div>
        <div id="diag" class="diagnosis"></div>
        <div class="cta">
            <p>Искаш ли бизнесът ти да е печеливш?</p>
            <a href="https://pdnailsschool.com/pricing-course">ЗАПИШИ СЕ ЗА ОБУЧЕНИЕТО</a>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const r = parseFloat(document.getElementById('rent').value) || 0;
        const e = parseFloat(document.getElementById('electric').value) || 0;
        const a = parseFloat(document.getElementById('accountant').value) || 0;
        const s = parseFloat(document.getElementById('social').value) || 0;
        const sal = parseFloat(document.getElementById('salary').value) || 0;
        const o = parseFloat(document.getElementById('others').value) || 0;
        const h = parseFloat(document.getElementById('hours').value) || 176;

        const t = parseFloat(document.getElementById('time').value) || 0;
        const m = parseFloat(document.getElementById('mat').value) || 0;
        const curr = parseFloat(document.getElementById('current').value) || 0;

        // ЛОГИКА
        const totalMonthly = r + e + a + s + sal + o;
        const costPerMin = (totalMonthly / h) / 60;
        const baseCost = (t * costPerMin) + m;
        
        // ФОРМУЛА: Делене на 0.60
        const ideal = Math.ceil(baseCost / 0.60);

        document.getElementById('results').style.display = 'block';
        document.getElementById('idealPrice').innerText = ideal.toFixed(2) + ' €';

        const diag = document.getElementById('diag');
        if (curr > 0) {
            if (curr < ideal) {
                diag.className = 'diagnosis red';
                diag.innerHTML = 'ВНИМАНИЕ! Подарявате по ' + (ideal - curr).toFixed(2) + ' € на клиент. Вашата цена трябва да бъде минимум ' + ideal + ' €!';
            } else {
                diag.className = 'diagnosis green';
                diag.innerHTML = 'ПОЗДРАВЛЕНИЯ! Вашият бизнес е устойчив и печеливш.';
            }
        } else {
            diag.style.display = 'none';
        }
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
